# =============================================================================
# Chimera Operating System — Limine Configuration (v8.x Format)
# limine.conf
# =============================================================================

timeout: 0

/Chimera Operating System
    protocol: limine
    kernel_path: boot():/kernel.elf
    module_path: boot():/bin/cat
    module_path: boot():/bin/chmod
    module_path: boot():/bin/clear
    module_path: boot():/bin/cp
    module_path: boot():/bin/dash
    module_path: boot():/bin/date
    module_path: boot():/bin/df
    module_path: boot():/bin/echo
    module_path: boot():/bin/false
    module_path: boot():/bin/kill
    module_path: boot():/bin/ls
    module_path: boot():/bin/mkdir
    module_path: boot():/bin/mv
    module_path: boot():/bin/pwd
    module_path: boot():/bin/rm
    module_path: boot():/bin/sh
    module_path: boot():/bin/sleep
    module_path: boot():/bin/true
    module_path: boot():/private/etc/hosts
    module_path: boot():/private/etc/motd
    module_path: boot():/private/etc/version
    module_path: boot():/sbin/ifconfig
    module_path: boot():/sbin/ping
    module_path: boot():/usr/bin/basename
    module_path: boot():/usr/bin/calc
