    module_path: boot():/usr/bin/nc
    module_path: boot():/usr/bin/neofetch
    module_path: boot():/usr/bin/proclist
    module_path: boot():/usr/bin/seq
    module_path: boot():/usr/bin/smpdemo
    module_path: boot():/usr/bin/stat
    module_path: boot():/usr/bin/tail
    module_path: boot():/usr/bin/tcc
    module_path: boot():/usr/bin/tee
    module_path: boot():/usr/bin/touch
    module_path: boot():/usr/bin/uname
    module_path: boot():/usr/bin/uptime
